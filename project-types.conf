# Project type -> skill categories.
#
# `make update_skills` asks which type a project is; the sync installs every
# skill in the listed categories (and generates matching Cursor rules).
#
# Format:  <type>: <category> <category> ...
# A category is a path under skills/ that directly contains skill folders —
# e.g. `engineering/kmp` or `productivity`. The sync globs <category>/*/SKILL.md.
#
# Edit freely — add a type, add a category, remix the mapping. The sync reads
# this file at run time, so changes take effect on the next `make update_skills`.

# `engineering/common` (universal dev skills, e.g. git-commit) and
# `productivity` (platform-agnostic workflow helpers: grilling, handoff, etc.)
# are included in every type below.

# Kotlin Multiplatform app (shared + Android + iOS): everything except backend.
# Note: `engineering/ios` is the SHARED iOS/SwiftUI category; the iOS-only
# `engineering/ios-only` category (e.g. the .xcstrings localization skill) is
# deliberately excluded — KMP apps localize via the `localization-kmp` skill in
# the `engineering/kmp` category.
kmp:     engineering/common productivity engineering/kmp engineering/ios

# Go / backend service: everything except the mobile categories.
backend: engineering/common productivity engineering/backend

# iOS / watchOS-only app: common + the shared iOS skills + iOS-only skills.
ios:     engineering/common productivity engineering/ios engineering/ios-only

# Catch-all: universal skills only.
other:   engineering/common productivity
